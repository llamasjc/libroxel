<html lang="en">

  <meta name="theme-color" content="#6eb4f0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/Selawik-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Phosphor-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>

<body>
  <header class="topbar">
    <a class="brand" id="brand" href="/" aria-label="Home" title="Home">

  <main id="page">
    <noscript><p>The PlayLibre website needs JavaScript to show games and friends.</p></noscript>
  </main>
  <footer>
    PlayLibre is free and open source. Donations are highly appreciated: <a href="/donate">Donate</a>.
    Games, servers and accounts all live on the PlayLibre Hub.
    <a href="/download">Download the app</a>. <a href="/privacy">Privacy</a>.

</html>
