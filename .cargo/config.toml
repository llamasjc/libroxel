[target.'cfg(target_os = "android")']
rustflags = ["--cfg", 'target_abi="sim"', "-A", "explicit_builtin_cfgs_in_flags"]

# 32-bit Android: switch on NEON, the chip's vector maths. Rust leaves it
# off for this target, but every device that runs Android 8 (our oldest)
# has it, and Bevy's maths, physics and drawing use it everywhere.
[target.armv7-linux-androideabi]
rustflags = ["-C", "target-feature=+neon"]
