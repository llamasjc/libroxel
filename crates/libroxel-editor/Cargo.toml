[package]
name = "libroxel-editor"
description = "The Libroxel editor: build a world, write scripts, and press Play to test it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# One app for everything: the editor, `libroxel server` and `libroxel hub`.
[[bin]]
name = "libroxel"
path = "src/main.rs"

[dependencies]
libroxel-instance.workspace = true
libroxel-script.workspace = true
libroxel-engine.workspace = true
libroxel-net.workspace = true
libroxel-hub = { path = "../libroxel-hub", version = "0.0.1" }
bevy.workspace = true
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
transform-gizmo-egui = "0.11"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
