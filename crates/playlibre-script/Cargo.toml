[package]
name = "playlibre-script"
description = "Luau scripting runtime for PlayLibre, bound to the instance tree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
playlibre-instance.workspace = true
mlua.workspace = true
thiserror.workspace = true
serde_json.workspace = true
rbx_reflection = "7.0"
rbx_reflection_database = "3.0"
rbx_types = "3.1"
# Unguessable GUIDs (HttpService:GenerateGUID).
getrandom = "0.3"
# Reads scripts to make the code sent to players hard to read (see shield.rs).
full_moon = { version = "3.0", features = ["luau"] }

# Luau's JIT only makes code for 64-bit processors. On 32-bit ARM it would do
# nothing, and its code needs `__clear_cache`, which 32-bit Android doesn't
# have, so the app can't even load there.
[target.'cfg(not(target_arch = "arm"))'.dependencies]
mlua = { workspace = true, features = ["luau-jit"] }

[lints]
workspace = true
