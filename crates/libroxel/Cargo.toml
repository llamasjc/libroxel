[package]
name = "libroxel"
description = "Libroxel: play, host and make games, from one home screen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "libroxel"

[lib]
path = "src/lib.rs"

# One app for everything: the home screen, the editor and `libroxel server`.
[[bin]]
name = "libroxel"
path = "src/main.rs"

[dependencies]
libroxel-instance.workspace = true
libroxel-script.workspace = true
libroxel-engine.workspace = true
libroxel-net.workspace = true
libroxel-rbx.workspace = true
libroxel-hub = { path = "../libroxel-hub", version = "0.0.1" }
bevy.workspace = true
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts"] }
transform-gizmo-egui = "0.11"
egui-phosphor = { version = "0.14", default-features = false, features = ["bold"] }
serde_json.workspace = true
ureq = "3"
sha2 = "0.10"
ed25519-dalek = "3"
data-encoding = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
bevy_egui = { version = "0.43", default-features = false, features = ["manage_clipboard"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "pollster"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-game-activity"] }
wgpu = { version = "30", default-features = false, features = ["gles"] }
jni = "0.21"

[lints]
workspace = true

# The Libroxel icon on libroxel.exe (Explorer, the taskbar, shortcuts).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }
