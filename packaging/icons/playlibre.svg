<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The PlayLibre app icon: the glassy cube on a sky-blue Aero tile. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="0.55" stop-color="#3f9be8"/>
      <stop offset="1" stop-color="#1f62c4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#9df27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9df27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f9ff"/><stop offset="1" stop-color="#7cd6fa"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40bef0"/><stop offset="1" stop-color="#1880d6"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2896de"/><stop offset="1" stop-color="#0e52a8"/>
    </linearGradient>
    <linearGradient id="notch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6f78e"/><stop offset="1" stop-color="#5cc43e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0a2f66" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sky)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow)"/>
  <path d="M264 64 H760 A200 200 0 0 1 960 264 V420 C760 500 300 500 64 420 V264 A200 200 0 0 1 264 64 Z" fill="url(#gloss)"/>
  <rect x="70" y="70" width="884" height="884" rx="194" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="10"/>
  <g filter="url(#shadow)" transform="translate(512 540)">
    <polygon points="0,-330 286,-165 0,0 -286,-165" fill="url(#top)"/>
    <polygon points="-286,-165 0,0 0,330 -286,165" fill="url(#left)"/>
    <polygon points="286,-165 0,0 0,330 286,165" fill="url(#right)"/>
    <polygon points="0,-330 143,-247.5 0,-165 -143,-247.5" fill="url(#notch)"/>
    <polygon points="-286,-165 0,-330 100,-272 -172,-99" fill="#ffffff" fill-opacity="0.25"/>
    <polygon points="0,-330 286,-165 286,165 0,330 -286,165 -286,-165" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="12" stroke-linejoin="round"/>
    <path d="M-286,-165 L0,0 L286,-165 M0,0 L0,330" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6"/>
  </g>
</svg>
