<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420">
  <!-- The window behind the Mac disk image: drag the app onto Applications. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb0f0"/><stop offset="0.7" stop-color="#bfe4ff"/><stop offset="1" stop-color="#e6f5ff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdc5c"/><stop offset="1" stop-color="#4aa83a"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="660" height="420" fill="url(#sky)"/>
  <circle cx="90" cy="70" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="580" cy="110" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="470" cy="50" r="12" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M0 360 C150 320 300 330 420 360 C520 385 600 370 660 350 V420 H0 Z" fill="url(#hill)"/>
  <path d="M0 385 C200 360 420 400 660 380 V420 H0 Z" fill="#3c9a30" fill-opacity="0.6"/>
  <text x="330" y="60" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#1e3a5b">Install Libroxel</text>
  <text x="330" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#1e3a5b" fill-opacity="0.85">Drag Libroxel onto the Applications folder</text>
  <path d="M255 200 H385 V178 L425 210 L385 242 V220 H255 Z" fill="url(#arrow)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
</svg>
