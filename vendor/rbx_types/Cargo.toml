# PlayLibre's copy of rbx_types 3.1.0 (MIT, from rbx-dom), changed so a
# damaged attribute blob can't close the app: lengths and counts read from
# it no longer set aside memory before the bytes behind them arrive
# (src/attributes/reader.rs). Comments name the engine generically and
# outside links are left out. Everything else is as published.

[package]
edition = "2018"
name = "rbx_types"
version = "3.1.0"
authors = [
    "Lucien Greathouse <me@lpghatguy.com>",
    "Micah Reid <git@dekkonot.com>",
    "Ken Loeffler <kenloef@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Types for values in place and model files."
homepage = "https://github.com/rojo-rbx/rbx-dom"
license = "MIT"
resolver = "2"

[lib]
name = "rbx_types"
path = "src/lib.rs"

[dependencies.base64]
version = "0.13.0"

[dependencies.bitflags]
version = "1.3.2"

[dependencies.blake3]
version = "1.3.1"

[dependencies.lazy_static]
version = "1.4.0"

[dependencies.rand]
version = "0.8.5"

[dependencies.serde]
version = "1.0.137"
features = ["derive"]
optional = true

[dependencies.thiserror]
version = "1.0.31"
