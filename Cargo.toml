[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]
# A plain `cargo run` opens the PlayLibre app.
default-members = ["crates/playlibre"]

[workspace.package]
version = "0.1.19"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/llamasjc/playlibre"
authors = ["PlayLibre contributors"]

[workspace.dependencies]
# A fast hash for maps looked up thousands of times a frame.
foldhash = "0.2"
playlibre-instance = { path = "crates/playlibre-instance", version = "0.1.19" }
playlibre-script = { path = "crates/playlibre-script", version = "0.1.19" }
playlibre-engine = { path = "crates/playlibre-engine", version = "0.1.19" }
playlibre-net = { path = "crates/playlibre-net", version = "0.1.19" }
playlibre-rbx = { path = "crates/playlibre-rbx", version = "0.1.19" }
playlibre-avatar = { path = "crates/playlibre-avatar", version = "0.1.19" }
playlibre-hub = { path = "crates/playlibre-hub", version = "0.1.19" }
rbx_mesh = { version = "0.8.2", default-features = false, features = ["mesh", "mesh-v1", "union-graphics", "csgphs-v8-ruzstd"] }
thiserror = "2"
serde_json = "1"
# The JIT (`luau-jit`) is switched on per target in playlibre-script.
mlua = { version = "0.12", features = ["luau", "vendored"] }
bevy = { version = "0.20", default-features = false, features = ["3d", "audio", "wav", "mp3", "jpeg"] }
rapier3d = "0.36"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `cargo run` should play big games smoothly, so our own crates are fully
# optimised too (debug assertions stay on). Line tables keep backtraces
# readable without the slow links of full debug info.
[profile.dev]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Debug info for Bevy and friends is huge and rarely needed; keep it for our crates only.
debug = false
# Their debug checks cost speed on every frame, and in wgpu they also switch
# on the GPU driver's validation layers, which can make drawing several times
# slower. Our own crates keep their checks.
debug-assertions = false
overflow-checks = false

# The builds attached to GitHub Releases: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
# No link-time optimization: with a warm cache it made each release build
# about 4 minutes longer per platform (5 min instead of 1.5). Generic Bevy
# code is compiled into our own crates anyway, so little speed is lost; set
# lto = "thin" again to trade build time for the last few percent.
lto = false
codegen-units = 1
strip = true

# CI's Android build check (`cargo rustc --profile ci`): optimised like the
# release so it builds the same code, but without link-time optimization and
# in many pieces, so it is quick and small enough for any runner. The
# nightly workflow builds the real release settings.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
debug = false

# mlua with a cheap interrupt check (see vendor/mlua/Cargo.toml).
[patch.crates-io]
mlua = { path = "vendor/mlua" }
rbx_binary = { path = "vendor/rbx_binary" }
rbx_types = { path = "vendor/rbx_types" }
