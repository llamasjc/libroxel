[workspace]
resolver = "3"
members = ["crates/*"]
# A plain `cargo run` opens the Libroxel app.
default-members = ["crates/libroxel"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/llamasjc/libroxel"
authors = ["Libroxel contributors"]

[workspace.dependencies]
libroxel-instance = { path = "crates/libroxel-instance", version = "0.0.1" }
libroxel-script = { path = "crates/libroxel-script", version = "0.0.1" }
libroxel-engine = { path = "crates/libroxel-engine", version = "0.0.1" }
libroxel-net = { path = "crates/libroxel-net", version = "0.0.1" }
libroxel-rbx = { path = "crates/libroxel-rbx", version = "0.0.1" }
rbx_mesh = { version = "0.8.2", default-features = false, features = ["mesh", "mesh-v1", "union-graphics", "csgphs-v8-ruzstd"] }
thiserror = "2"
serde_json = "1"
mlua = { version = "0.12", features = ["luau", "luau-jit", "vendored"] }
bevy = { version = "0.20", default-features = false, features = ["3d", "audio", "wav", "mp3", "jpeg"] }
rapier3d = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is slow in debug builds; optimize dependencies but keep our own crates fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Debug info for Bevy and friends is huge and rarely needed; keep it for our crates only.
debug = false

# The builds attached to GitHub Releases: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
