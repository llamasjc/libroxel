name: Nightly

# The slow checks, once a night on main (and on demand): hours-long soak
# runs, the Android release build with its real settings, and the Android
# app started on an emulator. Each run fails loudly instead of waiting for
# a release to find the problem.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Minutes of game time for the soak run
        default: "120"

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PLAYLIBRE_NO_UPDATE: "1"
  PLAYLIBRE_NO_COMMAND: "1"

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-soak
      - name: Soak
        env:
          SOAK_SECONDS: ${{ (inputs.soak_minutes || '120') }}
          SOAK_ROUNDS: "20"
        run: |
          export SOAK_SECONDS=$((SOAK_SECONDS * 60))
          cargo test --locked -p playlibre-tests --test soak -- --nocapture --test-threads 1

  android-release-memory:
    # The release's Android libraries are linked with fat LTO, which once
    # ran the runner out of memory and dropped Android from v0.1.13 and
    # v0.1.14. This builds them exactly as the Release workflow does, with
    # the same swap, and records how much memory the link took, so a change
    # that pushes it over shows up the next morning instead of on a tag.
    name: android release build (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            clang: aarch64-linux-android
            machine: AArch64
            class: ELF64
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi
            machine: ARM
            class: ELF32
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the LTO build
        # Keep in step with the Android job in release.yml.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends time
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-android-${{ matrix.abi }}
      - name: Build with the release settings
        shell: bash
        env:
          CARGO_PROFILE_DIST_STRIP: "false"
          CARGO_PROFILE_DIST_LTO: fat
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          env="${{ matrix.target }}"; env="${env//-/_}"
          export "CC_$env=$ndk/bin/${{ matrix.clang }}26-clang" "CXX_$env=$ndk/bin/${{ matrix.clang }}26-clang++" "AR_$env=$ndk/bin/llvm-ar"
          export "CARGO_TARGET_${env^^}_LINKER=$ndk/bin/${{ matrix.clang }}26-clang"
          # Samples the memory in use every few seconds; the peak is what
          # decides whether the runner survives.
          ( peak=0; while sleep 5; do
              used=$(free -m | awk '/^Mem:/ {m=$3} /^Swap:/ {s=$3} END {print m + s}')
              (( used > peak )) && peak=$used && echo "$peak" > peak-mb
            done ) &
          watcher=$!
          /usr/bin/time -v -o time.txt cargo rustc --locked --profile dist -p playlibre --lib --crate-type cdylib \
            --target ${{ matrix.target }} -- -C link-arg=-Wl,-z,max-page-size=16384
          kill $watcher || true
          rss=$(awk -F': ' '/Maximum resident set size/ {print int($2 / 1024)}' time.txt)
          peak=$(cat peak-mb 2>/dev/null || echo 0)
          total=$(free -m | awk '/^Mem:/ {m=$2} /^Swap:/ {s=$2} END {print m + s}')
          {
            echo "### Android ${{ matrix.abi }} release build"
            echo
            echo "- Largest single process: ${rss} MB"
            echo "- Memory in use at the peak (RAM + swap): ${peak} MB of ${total} MB"
          } >> "$GITHUB_STEP_SUMMARY"
          # Warn well before the runner would run out.
          if (( peak * 100 > total * 80 )); then
            echo "::warning::The ${{ matrix.abi }} release build used ${peak} MB of ${total} MB (RAM + swap). It's close to running the release runner out of memory."
          fi
      - name: Check the library
        run: |
          packaging/ci/check-android-lib.sh target/${{ matrix.target }}/dist/libplaylibre.so \
            ${{ matrix.machine }} ${{ matrix.class }} ${{ matrix.target }}

  android-emulator:
    # Installs a debug APK on an Android emulator, opens the app, and checks
    # it is still running and drawing after half a minute. Emulators on the
    # runners are x86_64, so this build adds an x86_64 library that never
    # ships; the code is the same as on phones.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-android-x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Build a debug APK
        shell: bash
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_x86_64_linux_android="$ndk/bin/x86_64-linux-android26-clang" \
            CXX_x86_64_linux_android="$ndk/bin/x86_64-linux-android26-clang++" \
            AR_x86_64_linux_android="$ndk/bin/llvm-ar" \
            CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ndk/bin/x86_64-linux-android26-clang"
          cargo rustc --locked --profile ci -p playlibre --lib --crate-type cdylib --target x86_64-linux-android \
            -- -C link-arg=-Wl,-z,max-page-size=16384
          libs=packaging/android/app/src/main/jniLibs/x86_64
          mkdir -p "$libs"
          cp target/x86_64-linux-android/ci/libplaylibre.so "$libs/"
          cp "$ndk/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" "$libs/"
          ANDROID_ABIS=x86_64 gradle -p packaging/android --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: packaging/ci/android-emulator-smoke.sh packaging/android/app/build/outputs/apk/debug/app-debug.apk
