name: Release

# Push a tag like `v0.1.0` to build Libroxel for Linux, Windows and macOS and
# publish the builds as a GitHub Release. "Run workflow" on the Actions tab
# builds the same files without publishing, to try a build first.
#
# Pushes to main build too, without publishing, only to keep the build
# cache warm: GitHub lets a tag's run use the caches main saved, but not the
# ones an earlier tag saved, so without this every release starts cold.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

# A newer push to main makes an older warm-up pointless.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # The Mac app runs on Apple silicon and Intel. The two halves build
          # side by side, and the mac job joins them into one app.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            mac_half: true
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            mac_half: true
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.name }}
          # Only main's cache can be used by later releases.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        shell: bash
        run: |
          cargo build --locked --profile dist -p libroxel --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="libroxel-$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp target/${{ matrix.target }}/dist/libroxel "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="libroxel-$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp target/${{ matrix.target }}/dist/libroxel.exe "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          7z a -tzip "$dir.zip" "$dir" > /dev/null
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - name: Keep the Mac half
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p half && cp target/${{ matrix.target }}/dist/libroxel half/libroxel-${{ matrix.target }}
          echo "ASSET=half/libroxel-${{ matrix.target }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          # dist-… files go in the release; the Mac halves only feed the mac job.
          name: ${{ matrix.mac_half && 'half' || 'dist' }}-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  mac:
    name: Package (macOS universal)
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: half-*
          path: half
          merge-multiple: true
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          dir="libroxel-$VERSION-macos-universal"
          app="$dir/Libroxel.app"
          mkdir -p "$app/Contents/MacOS"
          # One app that runs natively on both Apple silicon and Intel Macs.
          lipo -create -output "$app/Contents/MacOS/libroxel" \
            half/libroxel-aarch64-apple-darwin half/libroxel-x86_64-apple-darwin
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Ad-hoc signature: an unsigned arm64 binary won't launch at all.
          codesign --force --deep --sign - "$app"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          ditto -c -k --keepParent "$dir" "$dir.zip"
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-universal
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  hub:
    # The Hub on its own, for the server, and the script that sets it up
    # there. Servers set up with it fetch these from each new release.
    name: Build (Hub server)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-hub
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          cargo build --locked --profile dist -p libroxel-hub --bin libroxel-hub
          mkdir hub
          cp target/dist/libroxel-hub hub/libroxel-hub-linux-x86_64
          cp packaging/hub/setup-hub.sh packaging/hub/update-hub.sh hub/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-hub
          path: hub/*
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [build, mac, hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Tags like v0.2.0-beta.1 become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
