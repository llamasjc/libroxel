name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["web/**", "docs/**", "**.md", "packaging/web/**"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  wait-for-main:
    # A tag pushed with main starts two Release runs at once, and their Mac jobs
    # queue for the same few Macs until GitHub cancels one. On a tag, wait for
    # main's run of this commit to finish first, which also leaves its cache ready.
    name: Wait for main
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for main's build of this commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 120); do
            left=$(gh api "repos/$GH_REPO/actions/workflows/release.yml/runs?branch=main&head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length') || left=0
            [[ "$left" == 0 ]] && exit 0
            echo "main is still building this commit, checking again in 30 seconds"
            sleep 30
          done
          echo "::warning::main was still building after an hour, carrying on anyway"

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64compatible
          # ARM builds are new: one that fails doesn't hold the release back.
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            optional: true
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
            optional: true
    continue-on-error: ${{ matrix.optional == true }}
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
      SIGN: ${{ github.ref_type == 'tag' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "PLAYLIBRE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "PLAYLIBRE_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        shell: bash
        run: |
          cargo build --locked --profile dist -p playlibre --target ${{ matrix.target }}

      - name: Build AppImage and .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="playlibre-$VERSION-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/dist/playlibre"

          appdir="PlayLibre.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
          install -m 755 "$bin" "$appdir/usr/bin/playlibre"
          install -m 755 packaging/linux/AppRun "$appdir/AppRun"
          cp packaging/linux/playlibre.desktop "$appdir/playlibre.desktop"
          cp packaging/linux/playlibre.desktop "$appdir/usr/share/applications/"
          cp packaging/icons/playlibre-256.png "$appdir/playlibre.png"
          cp packaging/icons/playlibre-256.png "$appdir/usr/share/icons/hicolor/256x256/apps/playlibre.png"
          ln -s playlibre.png "$appdir/.DirIcon"
          arch="${{ matrix.arch }}"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$arch.AppImage"
          chmod +x appimagetool
          ARCH="$arch" ./appimagetool --appimage-extract-and-run "$appdir" "$name.AppImage"

          deb="deb/playlibre"
          mkdir -p "$deb/DEBIAN" "$deb/usr/lib/playlibre" "$deb/usr/bin" "$deb/usr/share/applications" "$deb/usr/share/doc/playlibre"
          debver="${VERSION//[^0-9A-Za-z.+~]/\~}"
          [[ "$debver" =~ ^[0-9] ]] || debver="0~$debver"
          debarch=$(dpkg --print-architecture)
          sed -e "s/@VERSION@/$debver/" -e "s/^Architecture: .*/Architecture: $debarch/" packaging/linux/deb/control > "$deb/DEBIAN/control"
          install -m 755 "$bin" "$deb/usr/lib/playlibre/playlibre"
          ln -s ../lib/playlibre/playlibre "$deb/usr/bin/playlibre"
          ln -s playlibre "$deb/usr/bin/libroxel"
          cp packaging/linux/playlibre.desktop "$deb/usr/share/applications/"
          for size in 16 24 32 48 64 128 256 512; do
            install -D -m 644 "packaging/icons/playlibre-$size.png" "$deb/usr/share/icons/hicolor/${size}x${size}/apps/playlibre.png"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$deb/usr/share/doc/playlibre/"
          dpkg-deb --root-owner-group --build "$deb" "$name.deb"

          mkdir dist && mv "$name.AppImage" "$name.deb" dist/
          echo "ASSET=dist/*" >> "$GITHUB_ENV"

      - name: Build installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          src="target/${{ matrix.target }}/dist"
          cp README.md LICENSE-MIT LICENSE-APACHE "$src/"
          if ! command -v iscc >/dev/null; then
            if [[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
              export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
            else
              choco install innosetup --no-progress -y
              export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
            fi
          fi
          name="playlibre-$VERSION-${{ matrix.name }}-setup"
          numeric=$(echo "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+){0,3}' || true)
          numeric="${numeric:-0}.0.0.0"; numeric=$(echo "$numeric" | cut -d. -f1-4)
          export MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*'
          iscc "/DVersion=$VERSION" "/DNumericVersion=$numeric" "/DArch=${{ matrix.arch }}" "/DSource=$(cygpath -w "$PWD/$src")" "/DOutput=$name" "/O$(cygpath -w "$PWD")" "$(cygpath -w packaging/windows/playlibre.iss)"
          echo "ASSET=$name.exe" >> "$GITHUB_ENV"

      - name: Upload unsigned installer
        id: unsigned
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.name }}
          path: ${{ env.ASSET }}
          retention-days: 1

      - name: Sign installer
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: libroxel
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed

      - name: Use signed installer
        if: runner.os == 'Windows' && env.SIGN == 'true'
        shell: bash
        run: mv -f "signed/$ASSET" "$ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  mac-half:
    name: Build (${{ matrix.name }})
    needs: wait-for-main
    # macos-15, not macos-latest: the newest image has few Macs, and jobs
    # waiting for one were cancelled after 15 minutes. iOS stays on the
    # newest, as App Store uploads need the latest SDK.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: aarch64-apple-darwin
          - name: macos-x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then export PLAYLIBRE_VERSION="${GITHUB_REF_NAME#v}"; else export PLAYLIBRE_VERSION="dev-${GITHUB_SHA::7}"; fi
          cargo build --locked --profile dist -p playlibre --target ${{ matrix.target }}
      - name: Copy binary
        run: |
          mkdir -p half && cp target/${{ matrix.target }}/dist/playlibre half/playlibre-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: half-${{ matrix.name }}
          path: half/playlibre-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  mac:
    name: Package (macOS universal)
    needs: mac-half
    runs-on: macos-15
    env:
      NOTARIZE: ${{ github.ref_type == 'tag' && secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: half-*
          path: half
          merge-multiple: true
      - name: Import certificate
        if: env.NOTARIZE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build .dmg
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          dir="playlibre-$VERSION-macos-universal"
          app="$dir/PlayLibre.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/playlibre" \
            half/playlibre-aarch64-apple-darwin half/playlibre-x86_64-apple-darwin
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          mkdir -p "$app/Contents/Resources" playlibre.iconset
          for size in 16 32 128 256 512; do
            cp "packaging/icons/playlibre-$size.png" "playlibre.iconset/icon_${size}x${size}.png"
            cp "packaging/icons/playlibre-$((size * 2)).png" "playlibre.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns playlibre.iconset -o "$app/Contents/Resources/playlibre.icns"
          if [[ "$NOTARIZE" == true ]]; then
            codesign --force --options runtime --timestamp --entitlements packaging/macos/entitlements.plist --sign "Developer ID Application" "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          tiffutil -cathidpicheck packaging/macos/dmg-background.png packaging/macos/dmg-background@2x.png -out background.tiff
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install create-dmg
          create-dmg \
            --volname "PlayLibre" \
            --volicon "$app/Contents/Resources/playlibre.icns" \
            --background background.tiff \
            --window-pos 200 120 --window-size 660 442 \
            --icon-size 128 --text-size 13 \
            --icon "PlayLibre.app" 165 210 \
            --hide-extension "PlayLibre.app" \
            --app-drop-link 495 210 \
            --no-internet-enable \
            "$dir.dmg" "$dir/"
          if [[ "$NOTARIZE" == true ]]; then
            codesign --force --timestamp --sign "Developer ID Application" "$dir.dmg"
            xcrun notarytool submit "$dir.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dir.dmg"
            xcrun stapler staple "$app"
          fi
          mkdir dist
          # Copies from before the rename (Libroxel, up to 0.1.17) update from
          # this archive and look for Libroxel.app in it: put the same app in
          # under that name too, as hard links, so it costs no extra space.
          mkdir old-name && (cd "$dir" && pax -rwl PlayLibre.app ../old-name) && mv old-name/PlayLibre.app "$dir/Libroxel.app"
          tar -czf "dist/$dir.app.tar.gz" -C "$dir" PlayLibre.app Libroxel.app
          mv "$dir.dmg" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  hub:
    name: Build (Hub server)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-hub
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          cargo build --locked --profile dist -p playlibre-hub --bin playlibre-hub
          mkdir hub
          cp target/dist/playlibre-hub hub/playlibre-hub-linux-x86_64
          # The name a Hub server set up before the rename looks for when it
          # updates itself; the new setup-hub.sh then moves it to the new names.
          cp target/dist/playlibre-hub hub/libroxel-hub-linux-x86_64
          cp packaging/hub/setup-hub.sh packaging/hub/update-hub.sh hub/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-hub
          path: hub/*
          if-no-files-found: error

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    # No continue-on-error: a release without the Android app must not publish.
    timeout-minutes: 120
    env:
      PLAY: ${{ github.ref_type == 'tag' && secrets.PLAY_SERVICE_ACCOUNT != '' && secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the LTO build
        # The fat LTO link of each Android library needs more memory than the
        # runner has: the armv7 link ran it out and the runner was shut down
        # (v0.1.13 and v0.1.14). Swap and the disk freed for it cover that.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Build
        shell: bash
        env:
          CARGO_PROFILE_DIST_STRIP: "false"
          CARGO_PROFILE_DIST_LTO: fat
          # SHA-256 of the certificate every released APK has been signed with (public, not a secret).
          ANDROID_CERT_SHA256: d46e9e2345a84df08d5c4c227d2cdea817b97edbc932a68ad017ec0589dd32bc
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}" PLAYLIBRE_VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="dev-${GITHUB_SHA::7}" PLAYLIBRE_VERSION="dev-${GITHUB_SHA::7}"
          fi
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          for abi in arm64-v8a:aarch64-linux-android:aarch64-linux-android:AArch64:ELF64 armeabi-v7a:armv7-linux-androideabi:armv7a-linux-androideabi:ARM:ELF32; do
            IFS=: read -r name target clang machine class <<< "$abi"
            env="${target//-/_}"
            export "CC_$env=$ndk/bin/${clang}26-clang" "CXX_$env=$ndk/bin/${clang}26-clang++" "AR_$env=$ndk/bin/llvm-ar"
            export "CARGO_TARGET_${env^^}_LINKER=$ndk/bin/${clang}26-clang"
            cargo rustc --locked --profile dist -p playlibre --lib --crate-type cdylib --target "$target" \
              -- -C link-arg=-Wl,-z,max-page-size=16384
            packaging/ci/check-android-lib.sh "target/$target/dist/libplaylibre.so" "$machine" "$class" "$target"
            libs="packaging/android/app/src/main/jniLibs/$name"
            mkdir -p "$libs"
            cp "target/$target/dist/libplaylibre.so" "$libs/"
            lib="${target/armv7/arm}"
            cp "$ndk/sysroot/usr/lib/$lib/libc++_shared.so" "$libs/"
            # A library that names a symbol phones don't have (as v0.1.15 did
            # with __clear_cache) makes the app close at launch, so it must
            # not ship.
            packaging/ci/check-android-lib.sh "$libs/libplaylibre.so" "$machine" "$class" "$target"
          done
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # A throwaway key would make Android refuse the APK over any earlier
            # release ("App not installed"), so a release must use the real key.
            echo "::error::ANDROID_KEYSTORE is not set, so this release can't be signed with PlayLibre's key"
            exit 1
          else
            export ANDROID_KEYSTORE_PASSWORD=android ANDROID_KEY_ALIAS=playlibre ANDROID_KEY_PASSWORD=android
            keytool -genkeypair -keystore "$ANDROID_KEYSTORE" -storepass android -keypass android \
              -alias libroxel -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PlayLibre"
          fi
          gradle -p packaging/android --no-daemon assembleRelease bundleRelease
          out=packaging/android/app/build/outputs
          packaging/ci/check-android-apk.sh "$out/apk/release/app-release.apk"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            # Every APK must carry the same certificate as the releases before it,
            # or Android won't install it over them.
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            certs=$("$apksigner" verify --print-certs "$out/apk/release/app-release.apk")
            grep -qi "certificate SHA-256 digest: $ANDROID_CERT_SHA256" <<< "$certs" || {
              echo "$certs"
              echo "::error::The APK isn't signed with PlayLibre's release key ($ANDROID_CERT_SHA256), so Android would refuse it over earlier releases"
              exit 1
            }
          fi
          # And the libraries as they ended up inside the APK, in case the
          # packaging picked up something else.
          inside="$RUNNER_TEMP/apk-libs"
          rm -rf "$inside"
          unzip -q -o "$out/apk/release/app-release.apk" 'lib/*' -d "$inside"
          packaging/ci/check-android-lib.sh "$inside/lib/arm64-v8a/libplaylibre.so" AArch64 ELF64 aarch64-linux-android
          packaging/ci/check-android-lib.sh "$inside/lib/armeabi-v7a/libplaylibre.so" ARM ELF32 armv7-linux-androideabi
          mkdir dist
          cp "$out/apk/release/app-release.apk" "dist/playlibre-$VERSION-android.apk"
          cp "$out/bundle/release/app-release.aab" "dist/playlibre-$VERSION-android.aab"
      - uses: r0adkll/upload-google-play@v1
        if: env.PLAY == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.libroxel.app
          releaseFiles: dist/*.aab
          mappingFile: packaging/android/app/build/outputs/mapping/release/mapping.txt
          debugSymbols: packaging/android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          track: internal
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build (iOS)
    needs: wait-for-main
    runs-on: macos-latest
    # No continue-on-error: a release without the iOS app must not publish.
    env:
      SIGN: ${{ secrets.IOS_CERTIFICATE != '' && secrets.IOS_PROFILE != '' }}
      UPLOAD: ${{ github.ref_type == 'tag' && secrets.IOS_CERTIFICATE != '' && secrets.IOS_PROFILE != '' && secrets.APP_STORE_CONNECT_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Import certificate
        if: env.SIGN == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          echo "$IOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci ios.keychain
          security default-keychain -s ios.keychain
          security list-keychains -d user -s ios.keychain login.keychain
          security unlock-keychain -p ci ios.keychain
          security import cert.p12 -k ios.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ios.keychain
          rm cert.p12
          echo "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
      - name: Build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; export PLAYLIBRE_VERSION="$VERSION"
          else
            VERSION="dev-${GITHUB_SHA::7}"; export PLAYLIBRE_VERSION="$VERSION"
          fi
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          cargo build --locked --profile dist -p playlibre --bin playlibre --target aarch64-apple-ios
          app=Payload/PlayLibre.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/dist/playlibre "$app/"
          short=$(echo "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)
          plist="$RUNNER_TEMP/Info.plist"
          sed -e "s/@SHORT_VERSION@/${short:-0.0.1}/" -e "s/@BUILD@/$GITHUB_RUN_NUMBER/" packaging/ios/Info.plist > "$plist"
          xcrun actool packaging/ios/Assets.xcassets --compile "$app" --platform iphoneos \
            --minimum-deployment-target 15.0 --target-device iphone --target-device ipad \
            --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/icons.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" -c "Delete :CFBundleIcons~ipad" "$plist"
          /usr/libexec/PlistBuddy -c "Merge $RUNNER_TEMP/icons.plist" "$plist"
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          sdkbuild=$(xcrun --sdk iphoneos --show-sdk-build-version)
          xcode=$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); printf "%d%d%d0", v[1], v[2], v[3]}' | cut -c1-4)
          xcodebuild=$(xcodebuild -version | awk 'NR==2 {print $3}')
          for kv in "DTPlatformName:iphoneos" "DTPlatformVersion:$sdk" "DTPlatformBuild:$sdkbuild" "DTSDKName:iphoneos$sdk" \
            "DTSDKBuild:$sdkbuild" "DTXcode:$xcode" "DTXcodeBuild:$xcodebuild" "DTCompiler:com.apple.compilers.llvm.clang.1_0" \
            "BuildMachineOSBuild:$(sw_vers -buildVersion)"; do
            /usr/libexec/PlistBuddy -c "Add :${kv%%:*} string ${kv#*:}" "$plist"
          done
          plutil -convert binary1 -o "$app/Info.plist" "$plist"
          printf 'APPL????' > "$app/PkgInfo"
          mkdir dist
          if [[ "$SIGN" == "true" ]]; then
            profile="$RUNNER_TEMP/app.mobileprovision"
            security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/app.entitlements"
            cp "$profile" "$app/embedded.mobileprovision"
            codesign --force --timestamp=none --sign "Apple Distribution" \
              --entitlements "$RUNNER_TEMP/app.entitlements" "$app"
            zip -qry "dist/playlibre-$VERSION-ios.ipa" Payload
          else
            zip -qry "dist/playlibre-$VERSION-ios-unsigned.ipa" Payload
          fi
      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -t ios -f dist/*-ios.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [build, mac, hub, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check files
        # Every platform but the optional ARM builds must be here, or nothing publishes.
        run: |
          for end in -windows-x86_64-setup.exe -macos-universal.dmg -macos-universal.app.tar.gz -linux-x86_64.AppImage -linux-x86_64.deb \
            -android.apk -android.aab "-ios*.ipa"; do
            compgen -G "dist/playlibre-*$end" >/dev/null || { echo "::error::Missing playlibre-*$end"; exit 1; }
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Update manifest
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: |
          if [[ -z "$UPDATE_KEY" ]]; then echo "::warning::UPDATE_KEY is not set, so apps won't update to this release"; exit 0; fi
          cd dist
          entry() { f=$(compgen -G "playlibre-*$1") || { echo null; return; }; jq -n --arg n "$f" --arg s "$(sha256sum "$f" | cut -d' ' -f1)" '{name: $n, sha256: $s}'; }
          jq -n --arg v "${GITHUB_REF_NAME#v}" \
            --argjson windows "$(entry -windows-x86_64-setup.exe)" \
            --argjson macos "$(entry -macos-universal.app.tar.gz)" \
            --argjson appimage "$(entry -linux-x86_64.AppImage)" \
            --argjson deb "$(entry -linux-x86_64.deb)" \
            --argjson android "$(entry -android.apk)" \
            --argjson windows_arm "$(entry -windows-aarch64-setup.exe)" \
            --argjson appimage_arm "$(entry -linux-aarch64.AppImage)" \
            --argjson deb_arm "$(entry -linux-aarch64.deb)" \
            '{version: $v, files: {windows: $windows, macos: $macos, appimage: $appimage, deb: $deb, android: $android,
              "windows-aarch64": $windows_arm, "appimage-aarch64": $appimage_arm, "deb-aarch64": $deb_arm}}' > latest.json
          printf '%s\n' "$UPDATE_KEY" > ../key.pem
          openssl pkeyutl -sign -rawin -inkey ../key.pem -in latest.json | base64 -w0 > latest.json.sig
          rm ../key.pem
          cat latest.json
      - name: Delete old drafts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          body: |
            ## Download PlayLibre

            - **Windows:** `playlibre-…-windows-x86_64-setup.exe`, open it and follow the setup wizard
            - **Mac** (Apple silicon and Intel): `playlibre-…-macos-universal.dmg`, open it and drag PlayLibre onto Applications, then right-click it there and choose Open the first time
            - **Linux:** `playlibre-…-linux-x86_64.AppImage` for any Linux (make it executable and open it), or `playlibre-…-linux-x86_64.deb` for Debian and Ubuntu
            - **ARM computers:** `playlibre-…-windows-aarch64-setup.exe` for Windows on ARM (Snapdragon laptops), and `playlibre-…-linux-aarch64.AppImage` or `.deb` for ARM Linux (a Raspberry Pi 4 or 5 with 64-bit Raspberry Pi OS, for one)

            After installing, typing `playlibre` in a new terminal opens it.

            The other files (`playlibre-hub-linux-x86_64`, `setup-hub.sh`, `update-hub.sh`) are for the Hub's server.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=true
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            latest=false
          else
            newest=$( { gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name'; echo "$GITHUB_REF_NAME"; } | sort -V | tail -n1)
            [[ "$newest" == "$GITHUB_REF_NAME" ]] || latest=false
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=$latest
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == false ]] \
            || { echo "::error::The release is still a draft"; exit 1; }
