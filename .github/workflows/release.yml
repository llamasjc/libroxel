name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["web/**", "docs/**", "**.md", "packaging/web/**"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
      SIGN: ${{ github.ref_type == 'tag' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "LIBROXEL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "LIBROXEL_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        shell: bash
        run: |
          cargo build --locked --profile dist -p libroxel --target ${{ matrix.target }}

      - name: Build AppImage and .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="libroxel-$VERSION-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/dist/libroxel"

          appdir="Libroxel.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
          install -m 755 "$bin" "$appdir/usr/bin/libroxel"
          install -m 755 packaging/linux/AppRun "$appdir/AppRun"
          cp packaging/linux/libroxel.desktop "$appdir/libroxel.desktop"
          cp packaging/linux/libroxel.desktop "$appdir/usr/share/applications/"
          cp packaging/icons/libroxel-256.png "$appdir/libroxel.png"
          cp packaging/icons/libroxel-256.png "$appdir/usr/share/icons/hicolor/256x256/apps/libroxel.png"
          ln -s libroxel.png "$appdir/.DirIcon"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" "$name.AppImage"

          deb="deb/libroxel"
          mkdir -p "$deb/DEBIAN" "$deb/usr/lib/libroxel" "$deb/usr/bin" "$deb/usr/share/applications" "$deb/usr/share/doc/libroxel"
          debver="${VERSION//[^0-9A-Za-z.+~]/\~}"
          [[ "$debver" =~ ^[0-9] ]] || debver="0~$debver"
          sed "s/@VERSION@/$debver/" packaging/linux/deb/control > "$deb/DEBIAN/control"
          install -m 755 "$bin" "$deb/usr/lib/libroxel/libroxel"
          ln -s ../lib/libroxel/libroxel "$deb/usr/bin/libroxel"
          cp packaging/linux/libroxel.desktop "$deb/usr/share/applications/"
          for size in 16 24 32 48 64 128 256 512; do
            install -D -m 644 "packaging/icons/libroxel-$size.png" "$deb/usr/share/icons/hicolor/${size}x${size}/apps/libroxel.png"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$deb/usr/share/doc/libroxel/"
          dpkg-deb --root-owner-group --build "$deb" "$name.deb"

          mkdir dist && mv "$name.AppImage" "$name.deb" dist/
          echo "ASSET=dist/*" >> "$GITHUB_ENV"

      - name: Build installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          src="target/${{ matrix.target }}/dist"
          cp README.md LICENSE-MIT LICENSE-APACHE "$src/"
          if ! command -v iscc >/dev/null; then
            if [[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
              export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
            else
              choco install innosetup --no-progress -y
              export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
            fi
          fi
          name="libroxel-$VERSION-${{ matrix.name }}-setup"
          numeric=$(echo "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+){0,3}' || true)
          numeric="${numeric:-0}.0.0.0"; numeric=$(echo "$numeric" | cut -d. -f1-4)
          export MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*'
          iscc "/DVersion=$VERSION" "/DNumericVersion=$numeric" "/DSource=$(cygpath -w "$PWD/$src")" "/DOutput=$name" "/O$(cygpath -w "$PWD")" "$(cygpath -w packaging/windows/libroxel.iss)"
          echo "ASSET=$name.exe" >> "$GITHUB_ENV"

      - name: Upload unsigned installer
        id: unsigned
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.name }}
          path: ${{ env.ASSET }}
          retention-days: 1

      - name: Sign installer
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: libroxel
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed

      - name: Use signed installer
        if: runner.os == 'Windows' && env.SIGN == 'true'
        shell: bash
        run: mv -f "signed/$ASSET" "$ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  mac-half:
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: aarch64-apple-darwin
          - name: macos-x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then export LIBROXEL_VERSION="${GITHUB_REF_NAME#v}"; else export LIBROXEL_VERSION="dev-${GITHUB_SHA::7}"; fi
          cargo build --locked --profile dist -p libroxel --target ${{ matrix.target }}
      - name: Copy binary
        run: |
          mkdir -p half && cp target/${{ matrix.target }}/dist/libroxel half/libroxel-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: half-${{ matrix.name }}
          path: half/libroxel-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  mac:
    name: Package (macOS universal)
    needs: mac-half
    runs-on: macos-latest
    env:
      NOTARIZE: ${{ github.ref_type == 'tag' && secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: half-*
          path: half
          merge-multiple: true
      - name: Import certificate
        if: env.NOTARIZE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build .dmg
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          dir="libroxel-$VERSION-macos-universal"
          app="$dir/Libroxel.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/libroxel" \
            half/libroxel-aarch64-apple-darwin half/libroxel-x86_64-apple-darwin
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          mkdir -p "$app/Contents/Resources" libroxel.iconset
          for size in 16 32 128 256 512; do
            cp "packaging/icons/libroxel-$size.png" "libroxel.iconset/icon_${size}x${size}.png"
            cp "packaging/icons/libroxel-$((size * 2)).png" "libroxel.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns libroxel.iconset -o "$app/Contents/Resources/libroxel.icns"
          if [[ "$NOTARIZE" == true ]]; then
            codesign --force --options runtime --timestamp --entitlements packaging/macos/entitlements.plist --sign "Developer ID Application" "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          tiffutil -cathidpicheck packaging/macos/dmg-background.png packaging/macos/dmg-background@2x.png -out background.tiff
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install create-dmg
          create-dmg \
            --volname "Libroxel" \
            --volicon "$app/Contents/Resources/libroxel.icns" \
            --background background.tiff \
            --window-pos 200 120 --window-size 660 442 \
            --icon-size 128 --text-size 13 \
            --icon "Libroxel.app" 165 210 \
            --hide-extension "Libroxel.app" \
            --app-drop-link 495 210 \
            --no-internet-enable \
            "$dir.dmg" "$dir/"
          if [[ "$NOTARIZE" == true ]]; then
            codesign --force --timestamp --sign "Developer ID Application" "$dir.dmg"
            xcrun notarytool submit "$dir.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dir.dmg"
            xcrun stapler staple "$app"
          fi
          mkdir dist
          tar -czf "dist/$dir.app.tar.gz" -C "$dir" Libroxel.app
          mv "$dir.dmg" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  hub:
    name: Build (Hub server)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-hub
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          cargo build --locked --profile dist -p libroxel-hub --bin libroxel-hub
          mkdir hub
          cp target/dist/libroxel-hub hub/libroxel-hub-linux-x86_64
          cp packaging/hub/setup-hub.sh packaging/hub/update-hub.sh hub/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-hub
          path: hub/*
          if-no-files-found: error

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PLAY: ${{ github.ref_type == 'tag' && secrets.PLAY_SERVICE_ACCOUNT != '' && secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}" LIBROXEL_VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="dev-${GITHUB_SHA::7}" LIBROXEL_VERSION="dev-${GITHUB_SHA::7}"
          fi
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          ndk="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_aarch64_linux_android="$ndk/bin/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$ndk/bin/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$ndk/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo rustc --locked --profile dist -p libroxel --lib --crate-type cdylib --target aarch64-linux-android \
            -- -C link-arg=-Wl,-z,max-page-size=16384
          libs=packaging/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$libs"
          cp target/aarch64-linux-android/dist/liblibroxel.so "$libs/"
          cp "$ndk/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$libs/"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          else
            export ANDROID_KEYSTORE_PASSWORD=android ANDROID_KEY_ALIAS=libroxel ANDROID_KEY_PASSWORD=android
            keytool -genkeypair -keystore "$ANDROID_KEYSTORE" -storepass android -keypass android \
              -alias libroxel -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Libroxel"
          fi
          gradle -p packaging/android --no-daemon assembleRelease bundleRelease
          out=packaging/android/app/build/outputs
          mkdir dist
          cp "$out/apk/release/app-release.apk" "dist/libroxel-$VERSION-android.apk"
          cp "$out/bundle/release/app-release.aab" "dist/libroxel-$VERSION-android.aab"
      - uses: r0adkll/upload-google-play@v1
        if: env.PLAY == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: com.libroxel.app
          releaseFiles: dist/*.aab
          track: internal
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build (iOS)
    runs-on: macos-latest
    continue-on-error: true
    env:
      SIGN: ${{ secrets.IOS_CERTIFICATE != '' && secrets.IOS_PROFILE != '' }}
      UPLOAD: ${{ github.ref_type == 'tag' && secrets.IOS_CERTIFICATE != '' && secrets.IOS_PROFILE != '' && secrets.APP_STORE_CONNECT_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Import certificate
        if: env.SIGN == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          echo "$IOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci ios.keychain
          security default-keychain -s ios.keychain
          security list-keychains -d user -s ios.keychain login.keychain
          security unlock-keychain -p ci ios.keychain
          security import cert.p12 -k ios.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ios.keychain
          rm cert.p12
          echo "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
      - name: Build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; export LIBROXEL_VERSION="$VERSION"
          else
            VERSION="dev-${GITHUB_SHA::7}"; export LIBROXEL_VERSION="$VERSION"
          fi
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          cargo build --locked --profile dist -p libroxel --bin libroxel --target aarch64-apple-ios
          app=Payload/Libroxel.app
          mkdir -p "$app"
          cp target/aarch64-apple-ios/dist/libroxel "$app/"
          short=$(echo "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)
          plist="$RUNNER_TEMP/Info.plist"
          sed -e "s/@SHORT_VERSION@/${short:-0.0.1}/" -e "s/@BUILD@/$GITHUB_RUN_NUMBER/" packaging/ios/Info.plist > "$plist"
          xcrun actool packaging/ios/Assets.xcassets --compile "$app" --platform iphoneos \
            --minimum-deployment-target 15.0 --target-device iphone --target-device ipad \
            --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/icons.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" -c "Delete :CFBundleIcons~ipad" "$plist"
          /usr/libexec/PlistBuddy -c "Merge $RUNNER_TEMP/icons.plist" "$plist"
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          sdkbuild=$(xcrun --sdk iphoneos --show-sdk-build-version)
          xcode=$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); printf "%d%d%d0", v[1], v[2], v[3]}' | cut -c1-4)
          xcodebuild=$(xcodebuild -version | awk 'NR==2 {print $3}')
          for kv in "DTPlatformName:iphoneos" "DTPlatformVersion:$sdk" "DTPlatformBuild:$sdkbuild" "DTSDKName:iphoneos$sdk" \
            "DTSDKBuild:$sdkbuild" "DTXcode:$xcode" "DTXcodeBuild:$xcodebuild" "DTCompiler:com.apple.compilers.llvm.clang.1_0" \
            "BuildMachineOSBuild:$(sw_vers -buildVersion)"; do
            /usr/libexec/PlistBuddy -c "Add :${kv%%:*} string ${kv#*:}" "$plist"
          done
          plutil -convert binary1 -o "$app/Info.plist" "$plist"
          printf 'APPL????' > "$app/PkgInfo"
          mkdir dist
          if [[ "$SIGN" == "true" ]]; then
            profile="$RUNNER_TEMP/app.mobileprovision"
            security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/app.entitlements"
            cp "$profile" "$app/embedded.mobileprovision"
            codesign --force --timestamp=none --sign "Apple Distribution" \
              --entitlements "$RUNNER_TEMP/app.entitlements" "$app"
            zip -qry "dist/libroxel-$VERSION-ios.ipa" Payload
          else
            zip -qry "dist/libroxel-$VERSION-ios-unsigned.ipa" Payload
          fi
      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -t ios -f dist/*-ios.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [build, mac, hub, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check files
        run: |
          for end in -windows-x86_64-setup.exe -macos-universal.dmg -macos-universal.app.tar.gz -linux-x86_64.AppImage -linux-x86_64.deb; do
            compgen -G "dist/libroxel-*$end" >/dev/null || { echo "::error::Missing libroxel-*$end"; exit 1; }
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Update manifest
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: |
          if [[ -z "$UPDATE_KEY" ]]; then echo "::warning::UPDATE_KEY is not set, so apps won't update to this release"; exit 0; fi
          cd dist
          entry() { f=$(compgen -G "libroxel-*$1") || { echo null; return; }; jq -n --arg n "$f" --arg s "$(sha256sum "$f" | cut -d' ' -f1)" '{name: $n, sha256: $s}'; }
          jq -n --arg v "${GITHUB_REF_NAME#v}" \
            --argjson windows "$(entry -windows-x86_64-setup.exe)" \
            --argjson macos "$(entry -macos-universal.app.tar.gz)" \
            --argjson appimage "$(entry -linux-x86_64.AppImage)" \
            --argjson deb "$(entry -linux-x86_64.deb)" \
            --argjson android "$(entry -android.apk)" \
            '{version: $v, files: {windows: $windows, macos: $macos, appimage: $appimage, deb: $deb, android: $android}}' > latest.json
          printf '%s\n' "$UPDATE_KEY" > ../key.pem
          openssl pkeyutl -sign -rawin -inkey ../key.pem -in latest.json | base64 -w0 > latest.json.sig
          rm ../key.pem
          cat latest.json
      - name: Delete old drafts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          body: |
            ## Download Libroxel

            - **Windows:** `libroxel-…-windows-x86_64-setup.exe`, open it and follow the setup wizard
            - **Mac** (Apple silicon and Intel): `libroxel-…-macos-universal.dmg`, open it and drag Libroxel onto Applications, then right-click it there and choose Open the first time
            - **Linux:** `libroxel-…-linux-x86_64.AppImage` for any Linux (make it executable and open it), or `libroxel-…-linux-x86_64.deb` for Debian and Ubuntu

            After installing, typing `libroxel` in a new terminal opens it.

            The other files (`libroxel-hub-linux-x86_64`, `setup-hub.sh`, `update-hub.sh`) are for the Hub's server.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=true
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            latest=false
          else
            newest=$( { gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name'; echo "$GITHUB_REF_NAME"; } | sort -V | tail -n1)
            [[ "$newest" == "$GITHUB_REF_NAME" ]] || latest=false
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=$latest
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == false ]] \
            || { echo "::error::The release is still a draft"; exit 1; }
