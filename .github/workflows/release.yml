name: Release

# Push a tag like `v0.1.0` to build Libroxel for Linux, Windows and macOS and
# publish the builds as a GitHub Release. "Run workflow" on the Actions tab
# builds the same files without publishing, to try a build first.
#
# Pushes to main build too, without publishing, only to keep the build
# cache warm: GitHub lets a tag's run use the caches main saved, but not the
# ones an earlier tag saved, so without this every release starts cold.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

# A newer push to main makes an older warm-up pointless.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # The Mac app runs on Apple silicon and Intel. The two halves build
          # side by side, and the mac job joins them into one app.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            mac_half: true
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            mac_half: true
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.name }}
          # Only main's cache can be used by later releases.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        shell: bash
        run: |
          cargo build --locked --profile dist -p libroxel --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Two installers: a .run any Linux can use (it installs for you
          # alone, no password), and a .deb for Debian and Ubuntu.
          name="libroxel-$VERSION-${{ matrix.name }}"
          mkdir -p payload/libroxel
          cp target/${{ matrix.target }}/dist/libroxel packaging/linux/install.sh payload/libroxel/
          cp README.md LICENSE-MIT LICENSE-APACHE payload/libroxel/
          tar -czf payload.tar.gz -C payload libroxel
          cat packaging/linux/installer-header.sh payload.tar.gz > "$name.run"
          chmod +x "$name.run"

          deb="deb/libroxel"
          mkdir -p "$deb/DEBIAN" "$deb/usr/lib/libroxel" "$deb/usr/bin" "$deb/usr/share/applications" "$deb/usr/share/doc/libroxel"
          # Debian versions start with a digit: dev-1a2b3c4 becomes 0~dev~1a2b3c4.
          debver="${VERSION//[^0-9A-Za-z.+~]/~}"
          [[ "$debver" =~ ^[0-9] ]] || debver="0~$debver"
          sed "s/@VERSION@/$debver/" packaging/linux/deb/control > "$deb/DEBIAN/control"
          install -m 755 target/${{ matrix.target }}/dist/libroxel "$deb/usr/lib/libroxel/libroxel"
          ln -s ../lib/libroxel/libroxel "$deb/usr/bin/libroxel"
          cp packaging/linux/libroxel.desktop "$deb/usr/share/applications/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$deb/usr/share/doc/libroxel/"
          dpkg-deb --root-owner-group --build "$deb" "$name.deb"

          mkdir dist && mv "$name.run" "$name.deb" dist/
          echo "ASSET=dist/*" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # An installer, not a bare libroxel.exe: it adds Libroxel to the
          # Start menu, to PATH (so `libroxel` works in a terminal) and to
          # libroxel:// links, and can be uninstalled from Settings.
          src="target/${{ matrix.target }}/dist"
          cp README.md LICENSE-MIT LICENSE-APACHE "$src/"
          if ! command -v iscc >/dev/null; then
            if [[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
              export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
            else
              choco install innosetup --no-progress -y
              export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
            fi
          fi
          name="libroxel-$VERSION-${{ matrix.name }}-setup"
          iscc "/DVersion=$VERSION" "/DSource=$(cygpath -w "$PWD/$src")" "/DOutput=$name" "/O$(cygpath -w "$PWD")" packaging/windows/libroxel.iss
          echo "ASSET=$name.exe" >> "$GITHUB_ENV"

      - name: Keep the Mac half
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p half && cp target/${{ matrix.target }}/dist/libroxel half/libroxel-${{ matrix.target }}
          echo "ASSET=half/libroxel-${{ matrix.target }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          # dist-… files go in the release; the Mac halves only feed the mac job.
          name: ${{ matrix.mac_half && 'half' || 'dist' }}-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  mac:
    name: Package (macOS universal)
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: half-*
          path: half
          merge-multiple: true
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          dir="libroxel-$VERSION-macos-universal"
          app="$dir/Libroxel.app"
          mkdir -p "$app/Contents/MacOS"
          # One app that runs natively on both Apple silicon and Intel Macs.
          lipo -create -output "$app/Contents/MacOS/libroxel" \
            half/libroxel-aarch64-apple-darwin half/libroxel-x86_64-apple-darwin
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Ad-hoc signature: an unsigned arm64 binary won't launch at all.
          codesign --force --deep --sign - "$app"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          # A disk image to drag the app into Applications from.
          ln -s /Applications "$dir/Applications"
          hdiutil create -volname Libroxel -srcfolder "$dir" -ov -format UDZO "$dir.dmg"
          echo "ASSET=$dir.dmg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-universal
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  hub:
    # The Hub on its own, for the server, and the script that sets it up
    # there. Servers set up with it fetch these from each new release.
    name: Build (Hub server)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-hub
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          cargo build --locked --profile dist -p libroxel-hub --bin libroxel-hub
          mkdir hub
          cp target/dist/libroxel-hub hub/libroxel-hub-linux-x86_64
          cp packaging/hub/setup-hub.sh packaging/hub/update-hub.sh hub/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-hub
          path: hub/*
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [build, mac, hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # The release is made as a draft with every file on it, and only
      # then published, all at once: until that moment the download page,
      # the app's update check and Hub servers keep using the last release.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          body: |
            ## Download Libroxel

            - **Windows:** `libroxel-…-windows-x86_64-setup.exe`, open it to install
            - **Mac** (Apple silicon and Intel): `libroxel-…-macos-universal.dmg`, open it and drag Libroxel to Applications, then right-click it there and choose Open the first time
            - **Linux:** `libroxel-…-linux-x86_64.run` for any Linux (`sh libroxel-…-linux-x86_64.run`), or `libroxel-…-linux-x86_64.deb` for Debian and Ubuntu

            After installing, typing `libroxel` in a new terminal opens it.

            The other files (`libroxel-hub-linux-x86_64`, `setup-hub.sh`, `update-hub.sh`) are for the Hub's server.
          generate_release_notes: true
          # Tags like v0.2.0-beta.1 become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The app's release is the one download links point at.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then latest=false; else latest=true; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=$latest
