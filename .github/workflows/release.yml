name: Release

# Push a tag like `v0.1.0` to build Libroxel for Linux, Windows and macOS and
# publish the builds as a GitHub Release. It doesn't wait for CI.
#
# It's all or nothing: the release is only published once every platform
# has built. If one fails, nothing is published, the previous release stays
# where it is, and "Re-run failed jobs" finishes the same tag later.
# "Run workflow" on the Actions tab builds the same files without
# publishing, to try a build first.
#
# Pushes to main build too, without publishing, only to keep the build
# cache warm: GitHub lets a tag's run use the caches main saved, but not the
# ones an earlier tag saved, so without this every release starts cold.
on:
  push:
    tags: ["v*"]
    branches: [main]
    # Changes that can't affect the build don't need a warm-up. (Tags
    # always build: GitHub ignores these filters for tag pushes.)
    paths-ignore: ["web/**", "docs/**", "**.md", "packaging/web/**"]
  workflow_dispatch:

# A newer push to main cancels an older warm-up build, since it's pointless
# now. Tag runs are never cancelled: each version finishes and gets
# published, and pushing the same tag again waits for the first run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      # rust-lld links the big Windows exe in seconds instead of minutes.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.name }}
          # Only main's cache can be used by later releases.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        shell: bash
        run: |
          cargo build --locked --profile dist -p libroxel --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Two downloads, each with the Libroxel icon and an app menu
          # entry: an AppImage that runs on any Linux (download, make it
          # executable, open it; it adds itself to the menu and the
          # `libroxel` command the first time), and a .deb for Debian and Ubuntu.
          name="libroxel-$VERSION-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/dist/libroxel"

          appdir="Libroxel.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
          install -m 755 "$bin" "$appdir/usr/bin/libroxel"
          install -m 755 packaging/linux/AppRun "$appdir/AppRun"
          cp packaging/linux/libroxel.desktop "$appdir/libroxel.desktop"
          cp packaging/linux/libroxel.desktop "$appdir/usr/share/applications/"
          cp packaging/icons/libroxel-256.png "$appdir/libroxel.png"
          cp packaging/icons/libroxel-256.png "$appdir/usr/share/icons/hicolor/256x256/apps/libroxel.png"
          ln -s libroxel.png "$appdir/.DirIcon"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" "$name.AppImage"

          deb="deb/libroxel"
          mkdir -p "$deb/DEBIAN" "$deb/usr/lib/libroxel" "$deb/usr/bin" "$deb/usr/share/applications" "$deb/usr/share/doc/libroxel"
          # Debian versions start with a digit: dev-1a2b3c4 becomes 0~dev~1a2b3c4.
          debver="${VERSION//[^0-9A-Za-z.+~]/~}"
          [[ "$debver" =~ ^[0-9] ]] || debver="0~$debver"
          sed "s/@VERSION@/$debver/" packaging/linux/deb/control > "$deb/DEBIAN/control"
          install -m 755 "$bin" "$deb/usr/lib/libroxel/libroxel"
          ln -s ../lib/libroxel/libroxel "$deb/usr/bin/libroxel"
          cp packaging/linux/libroxel.desktop "$deb/usr/share/applications/"
          for size in 16 24 32 48 64 128 256 512; do
            install -D -m 644 "packaging/icons/libroxel-$size.png" "$deb/usr/share/icons/hicolor/${size}x${size}/apps/libroxel.png"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$deb/usr/share/doc/libroxel/"
          dpkg-deb --root-owner-group --build "$deb" "$name.deb"

          mkdir dist && mv "$name.AppImage" "$name.deb" dist/
          echo "ASSET=dist/*" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # A setup wizard, not a bare libroxel.exe: with the Libroxel icon,
          # it adds Libroxel to the Start menu (and the desktop), to PATH (so
          # `libroxel` works in a terminal) and to libroxel:// links, and
          # it's in Settings > Apps to uninstall.
          src="target/${{ matrix.target }}/dist"
          cp README.md LICENSE-MIT LICENSE-APACHE "$src/"
          if ! command -v iscc >/dev/null; then
            if [[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
              export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
            else
              choco install innosetup --no-progress -y
              export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
            fi
          fi
          name="libroxel-$VERSION-${{ matrix.name }}-setup"
          numeric=$(echo "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+){0,3}' || true)
          numeric="${numeric:-0}.0.0.0"; numeric=$(echo "$numeric" | cut -d. -f1-4)
          # Git Bash turns arguments that start with / into Windows paths, so
          # "/DVersion=..." reached iscc as a second script file. Stop that.
          export MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*'
          iscc "/DVersion=$VERSION" "/DNumericVersion=$numeric" "/DSource=$(cygpath -w "$PWD/$src")" "/DOutput=$name" "/O$(cygpath -w "$PWD")" "$(cygpath -w packaging/windows/libroxel.iss)"
          echo "ASSET=$name.exe" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  # The Mac app runs on Apple silicon and Intel. The two halves build side by
  # side, and the mac job joins them into one app. They're a job of their own
  # so the Mac packaging starts as soon as they're done, without waiting for
  # the slower Windows build.
  mac-half:
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            target: aarch64-apple-darwin
          - name: macos-x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked --profile dist -p libroxel --target ${{ matrix.target }}
      - name: Keep the Mac half
        run: |
          mkdir -p half && cp target/${{ matrix.target }}/dist/libroxel half/libroxel-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: half-${{ matrix.name }}
          path: half/libroxel-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  mac:
    name: Package (macOS universal)
    needs: mac-half
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: half-*
          path: half
          merge-multiple: true
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          dir="libroxel-$VERSION-macos-universal"
          app="$dir/Libroxel.app"
          mkdir -p "$app/Contents/MacOS"
          # One app that runs natively on both Apple silicon and Intel Macs.
          lipo -create -output "$app/Contents/MacOS/libroxel" \
            half/libroxel-aarch64-apple-darwin half/libroxel-x86_64-apple-darwin
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # The app's icon, made from the icon pictures in packaging/icons.
          mkdir -p "$app/Contents/Resources" libroxel.iconset
          for size in 16 32 128 256 512; do
            cp "packaging/icons/libroxel-$size.png" "libroxel.iconset/icon_${size}x${size}.png"
            cp "packaging/icons/libroxel-$((size * 2)).png" "libroxel.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns libroxel.iconset -o "$app/Contents/Resources/libroxel.icns"
          # Ad-hoc signature: an unsigned arm64 binary won't launch at all.
          codesign --force --deep --sign - "$app"
          # The usual Mac disk image: the app beside an Applications folder
          # on a picture that says to drag one onto the other.
          tiffutil -cathidpicheck packaging/macos/dmg-background.png packaging/macos/dmg-background@2x.png -out background.tiff
          # Skip Homebrew's own update, which takes longer than the install.
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install create-dmg
          create-dmg \
            --volname "Libroxel" \
            --volicon "$app/Contents/Resources/libroxel.icns" \
            --background background.tiff \
            --window-pos 200 120 --window-size 660 442 \
            --icon-size 128 --text-size 13 \
            --icon "Libroxel.app" 165 210 \
            --hide-extension "Libroxel.app" \
            --app-drop-link 495 210 \
            --no-internet-enable \
            "$dir.dmg" "$dir/"
          echo "ASSET=$dir.dmg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-universal
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  hub:
    # The Hub on its own, for the server, and the script that sets it up
    # there. Servers set up with it fetch these from each new release.
    name: Build (Hub server)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-hub
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          cargo build --locked --profile dist -p libroxel-hub --bin libroxel-hub
          mkdir hub
          cp target/dist/libroxel-hub hub/libroxel-hub-linux-x86_64
          cp packaging/hub/setup-hub.sh packaging/hub/update-hub.sh hub/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-hub
          path: hub/*
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [build, mac, hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check every installer is there
        run: |
          for end in -windows-x86_64-setup.exe -macos-universal.dmg -linux-x86_64.AppImage -linux-x86_64.deb; do
            compgen -G "dist/libroxel-*$end" >/dev/null || { echo "::error::Missing libroxel-*$end"; exit 1; }
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Remove drafts from earlier tries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A draft left behind by a run that stopped halfway would otherwise
          # sit next to the new one with the same tag.
          gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done
      # The release is made as a draft with every file on it, and only
      # then published, all at once: until that moment the download page,
      # the app's update check and Hub servers keep using the last release.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          body: |
            ## Download Libroxel

            - **Windows:** `libroxel-…-windows-x86_64-setup.exe`, open it and follow the setup wizard
            - **Mac** (Apple silicon and Intel): `libroxel-…-macos-universal.dmg`, open it and drag Libroxel onto Applications, then right-click it there and choose Open the first time
            - **Linux:** `libroxel-…-linux-x86_64.AppImage` for any Linux (make it executable and open it), or `libroxel-…-linux-x86_64.deb` for Debian and Ubuntu

            After installing, typing `libroxel` in a new terminal opens it.

            The other files (`libroxel-hub-linux-x86_64`, `setup-hub.sh`, `update-hub.sh`) are for the Hub's server.
          generate_release_notes: true
          # Tags like v0.2.0-beta.1 become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Latest goes to the highest version, not to whichever run finished
          # last: if v0.1.1 finishes after v0.1.2, v0.1.2 stays Latest.
          latest=true
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            latest=false
          else
            newest=$( { gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name'; echo "$GITHUB_REF_NAME"; } | sort -V | tail -n1)
            [[ "$newest" == "$GITHUB_REF_NAME" ]] || latest=false
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=$latest
          [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == false ]] \
            || { echo "::error::The release is still a draft"; exit 1; }
