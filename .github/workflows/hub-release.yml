name: Hub release

# Push a tag like `hub-v0.1.2` to put out only the Hub for servers, in a few
# minutes instead of a whole release of the app. Servers set up with
# setup-hub.sh pick it up within 10 minutes, as they do full releases.
on:
  push:
    tags: ["hub-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  hub:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-hub
          save-if: false
      - name: Build
        run: |
          cargo build --locked --profile dist -p libroxel-hub --bin libroxel-hub
          mkdir hub
          cp target/dist/libroxel-hub hub/libroxel-hub-linux-x86_64
          cp packaging/hub/setup-hub.sh packaging/hub/update-hub.sh hub/
          cd hub && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: hub/*
          name: Hub ${{ github.ref_name }}
          body: Only the Hub, for servers. The app's builds are in the latest full release.
          # The app's download links keep pointing at the latest full release.
          make_latest: "false"
