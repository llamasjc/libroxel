name: An idea
description: Something Libroxel could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: What you'd use it for helps most.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it might work
      description: >-
        Optional. If it's a scripting API, describe the behaviour you need in
        your own words (see the clean-room rules in CONTRIBUTING.md).
